aid: onlia
name: Onlia
review:
  question: Does Onlia expose a public, self-serve developer portal or documented API?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Canada
  gated: true
  specsHarvested: 0
findings:
  summary: |
    Onlia (Onlia Agency Inc., a Canadian digital personal-lines insurance
    brokerage backed by Southampton Financial Inc.) publishes NO public
    developer portal, NO API reference, and NO downloadable machine-readable
    API description of any kind. Every conventional developer host under
    onlia.ca fails to resolve, and every conventional developer path on the
    marketing site returns 404. The company's only quote/bind/issue and
    self-service surface is app.onlia.ca — a consumer-facing Angular
    single-page application whose backend is private to that app — and its
    only "partner" surface is a marketing page that asks prospective affinity
    partners to send an email. This is an accurate and expected outcome for a
    Canadian personal-lines broker: Canada has no open-insurance mandate, and
    Consumer-Driven Banking explicitly excludes insurance, so there is no
    forcing function to publish anything.
  developerPortal:
    exists: false
    url: null
    classification: none
    note: >-
      No first-party developer portal of any kind was found. Nothing qualifies
      as a real self-serve portal, a partner login wall, or even a marketing
      "innovation"/API page.
  probes:
  - url: https://developer.onlia.ca/
    status: 000
    result: DNS does not resolve
  - url: https://developers.onlia.ca/
    status: 000
    result: DNS does not resolve
  - url: https://docs.onlia.ca/
    status: 000
    result: DNS does not resolve
  - url: https://api.onlia.ca/
    status: 000
    result: >-
      DNS does not resolve (NXDOMAIN). A historical TLS certificate for
      api.onlia.ca appears in Certificate Transparency logs, but no host is
      published today — there is no live API endpoint at this name.
  - url: https://www.onlia.ca/developers
    status: 404
    result: Not found
  - url: https://www.onlia.ca/developer
    status: 404
    result: Not found
  - url: https://www.onlia.ca/api
    status: 404
    result: Not found
  - url: https://www.onlia.ca/integrations
    status: 404
    result: Not found
  - url: https://www.onlia.ca/partners
    status: 200
    result: >-
      Live, but a pure B2B marketing page for affinity/group discount
      partnerships. No API, SDK, sandbox, documentation, or technical
      onboarding language. The call to action is a mailto link to a business
      development contact at the parent company.
  - url: https://app.onlia.ca/
    status: 200
    result: >-
      Live consumer self-serve application (Angular SPA on S3/CloudFront,
      Google reCAPTCHA, Canada Post AddressComplete, Zendesk). Asset
      references in the page shell point at dev-app.sys.igniteinsurance.ca,
      indicating the app runs on a white-labelled Ignite Insurance policy
      administration platform. Its backing API is private to the SPA and is
      not documented, versioned, or offered to third parties.
  - url: https://app.onlia.ca/openapi.json
    status: 404
    result: Not found
  - url: https://app.onlia.ca/swagger.json
    status: 404
    result: Not found
  - url: https://app.onlia.ca/swagger/v1/swagger.json
    status: 404
    result: Not found
  - url: https://app.onlia.ca/api-docs
    status: 404
    result: Not found
  - url: https://www.onlia.ca/openapi.json
    status: 404
    result: Not found
  - url: https://www.onlia.ca/swagger.json
    status: 404
    result: Not found
  - url: https://www.onlia.ca/.well-known/openid-configuration
    status: 404
    result: Not served
  - url: https://app.onlia.ca/.well-known/openid-configuration
    status: 404
    result: Not served
  - url: https://www.onlia.ca/.well-known/oauth-authorization-server
    status: 404
    result: Not served
  - url: https://partner.onlia.ca/
    status: 404
    result: >-
      Resolves to an Unbounce landing-page host; the page itself is gone.
      Marketing landing page infrastructure, never a technical surface.
  - url: https://partnerships.onlia.ca/
    status: 200
    result: >-
      Resolves to onlia.hasoffers.com (TUNE/HasOffers affiliate tracking).
      Serves "Account Not Active" — a decommissioned affiliate-marketing
      program, not an insurance integration surface.
  - url: https://prod-sf-esb-policy-management.us-e2.cloudhub.io/openapi.json
    status: 404
    result: >-
      Not found. Probed 2026-07-25 during the enrichment round; /swagger.json,
      /api/openapi.json, /api-docs and / are also 404 on this host.
  - url: https://prod-sf-esb-policy-management.us-e2.cloudhub.io/console
    status: 200
    result: >-
      Returns HTTP 200 with Content-Length 0 — an empty response, not a
      MuleSoft APIkit console and not a RAML/OAS document. Same on
      prod-sf-esb-authentication.us-e2.cloudhub.io/console. No machine-readable
      contract is exposed.
  - url: https://prod-jws.sys.igniteinsurance.ca/
    status: 200
    result: >-
      Live vendor host (Ignite Insurance) backing the consumer app's
      authentication calls. No /openapi.json, /swagger.json, /api-docs or
      /console is served (all 404).
  - url: https://www.onlia.ca/.well-known/security.txt
    status: 404
    result: Not served (Squarespace platform returns a JSON "security.txt not found").
  - url: https://app.onlia.ca/.well-known/security.txt
    status: 404
    result: Not served (S3 NoSuchKey).
  - url: https://www.onlia.ca/llms.txt
    status: 404
    result: Not served.
  - url: https://status.onlia.ca/
    status: 000
    result: DNS does not resolve — no status page.
  openapi:
    harvested: false
    count: 0
    note: >-
      No OpenAPI, Swagger, AsyncAPI, GraphQL SDL, .proto, or Postman artifact
      of any kind is published. No openapi/ directory was created because
      nothing real exists to save. Note for future reviewers: the word
      "swagger" does appear twice on https://www.onlia.ca/about — in the brand
      copy "clarity, flexibility, and a little swagger" — and is NOT a
      reference to the Swagger specification. Do not mistake it for one.
  privateBackend:
    discovered: '2026-07-25'
    method: >-
      Read the publicly served Angular bundle at
      https://app.onlia.ca/main.34f53c80bb93696f26f0.bundle.js (HTTP 200, 2.7 MB)
      and enumerated the backend hosts it calls.
    architecture: >-
      Onlia's consumer app is fronted by a MuleSoft Anypoint Platform (CloudHub)
      integration tier plus the Ignite Insurance policy administration platform.
      The SPA calls a set of per-domain CloudHub ESB applications in the us-e2
      region — authentication, policy management (auto), a home policy router, a
      document service, a VIN/MVR lookup service and a logging service — and an
      Ignite-hosted user-authentication service for login, token validation and
      password reset. Path families observed are /policy/auto/*, /policy/home/*
      and /api/* on the ESB hosts, and /igniteUserAuthentication/* on the Ignite
      host.
    hosts:
    - host: prod-sf-esb-policy-management.us-e2.cloudhub.io
      role: auto policy management (quote/save/update/search, cart, premium)
    - host: prod-sf-esb-home-policy-router.us-e2.cloudhub.io
      role: home policy routing (save/update/payment/reinstatement)
    - host: prod-sf-esb-authentication.us-e2.cloudhub.io
      role: registration, customer/contact records, reCAPTCHA validation, saved quotes
    - host: prod-sf-esb-document.us-e2.cloudhub.io
      role: policy document delivery
    - host: prod-sf-esb-vin-service.us-e2.cloudhub.io
      role: VIN and MVR/AutoPlus lookups
    - host: prod-sf-esb-auto-sf.us-e2.cloudhub.io
      role: claims search and update (Salesforce-backed)
    - host: prod-sf-esb-logger.us-e2.cloudhub.io
      role: client-side logging sink
    - host: prod-jws.sys.igniteinsurance.ca
      role: Ignite user authentication (login, token validation, password reset)
    publiclyOffered: false
    documented: false
    note: >-
      This does NOT change the review's answer. These are first-party, private
      backend services consumed by Onlia's own consumer SPA: they carry no
      public documentation, no published base URL, no third-party
      authentication model, no versioning policy, no terms, and no way to
      obtain credentials. Probed anonymously they expose no machine-readable
      contract (no OpenAPI/Swagger/RAML at any conventional path; /console
      returns an empty 200). No endpoint inventory is published in this repo and
      no apis.yml API entry is wired for them — recording an undocumented
      internal surface as a public API would misrepresent Onlia's posture. The
      finding is architectural: Onlia's quote/bind/issue/claims capability does
      run over REST services on MuleSoft CloudHub behind an Ignite policy
      administration platform, so the capability to expose a partner API exists
      technically; the company simply does not offer one.
  acord:
    posture: no ACORD reference found
    detail: >-
      No mention of ACORD, AL3, ACORD XML, ACORD certification, NGDS, IVANS,
      agency download, Applied Epic, or Vertafore AMS360 appears anywhere on
      onlia.ca, its blog, its broker-disclosure page, or the app.onlia.ca
      shell. As a direct-to-consumer digital brokerage Onlia does not present
      an agency-management-system integration story publicly; whatever carrier
      connectivity exists sits behind its Ignite policy administration vendor
      and is not disclosed.
  insuranceVerbs:
    quote:
      exposedAsAPI: false
      note: Consumer quote flow only, inside app.onlia.ca. No API.
    bind:
      exposedAsAPI: false
      note: Consumer purchase flow only, inside app.onlia.ca. No API.
    issue:
      exposedAsAPI: false
      note: Policy documents delivered through the consumer account. No API.
    fnol:
      exposedAsAPI: false
      note: >-
        Claims are reported by phone and through https://www.onlia.ca/claims.
        No FNOL API, no claims webhook, no partner claims intake endpoint.
    audience: consumer-facing only (no agent-facing or partner-facing API tier)
  auth:
    model: >-
      No public/third-party authentication model exists. The consumer app uses
      a first-party session login with Google reCAPTCHA; no OAuth2, API key,
      mTLS, or SAML partner federation is documented or discoverable. Neither
      /.well-known/openid-configuration nor
      /.well-known/oauth-authorization-server is served on www.onlia.ca or
      app.onlia.ca.
  webhooks:
    documented: false
    note: No event catalog, webhook documentation, or AsyncAPI description exists.
  postman:
    public: false
    note: No public Postman collection or workspace found.
  graphql:
    public: false
    note: No public /graphql surface found.
  sourceCode:
    githubOrganization: null
    note: >-
      GET https://api.github.com/orgs/onlia returns 404, and a GitHub
      organization search for "onlia" returns 0 results. No public SDKs.
      Re-checked 2026-07-25: an npm registry search for "onlia" returns zero
      packages, https://pypi.org/pypi/onlia/json returns 404, and a GitHub
      repository search for "onlia" returns only unrelated third-party repos
      (plus this API Evangelist profile). No first-party client library exists
      in any registry, so no packages/ artifact was created.
  transports:
  - protocol: REST
    scheme: https
    documented: false
    note: >-
      A private REST backend serves app.onlia.ca — confirmed 2026-07-25 by
      reading the public Angular bundle (see findings.privateBackend): MuleSoft
      CloudHub ESB applications plus an Ignite Insurance authentication service.
      It is neither documented nor offered publicly, publishes no base URL, and
      exposes no machine-readable contract when probed anonymously.
  - protocol: GraphQL
    documented: false
  - protocol: WebSocket
    scheme: wss
    documented: false
  - protocol: gRPC
    documented: false
  - protocol: ACORD/EDI
    documented: false
    note: No ACORD AL3, ACORD XML, or IVANS transport is publicly referenced.
  businessContext:
    role: brokerage (Onlia Agency Inc.), not an underwriting carrier
    owner: Southampton Financial Inc. (Southampton group of companies)
    carrierPanel:
    - Aviva Insurance Company
    - Gore Mutual
    - Economical/Definity
    - Pembridge Insurance
    - Pafco
    - Echelon
    - Wawanesa
    - Unica
    - Forward Insurance
    - Premier
    - Facility (Intact)
    - Apollo
    carrierPanelSource: https://www.onlia.ca/broker-disclosure
    regulatoryNote: >-
      Canada splits supervision: OSFI prudentially supervises the
      federally-regulated carriers on Onlia's panel while provincial regulators
      (FSRA in Ontario, AMF in Quebec) handle market conduct and broker
      licensing. There is no open-insurance mandate in Canada, and
      Consumer-Driven Banking excludes insurance, so no regulator compels an
      API here.
